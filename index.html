<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a);
const LS={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let U=LS.g('sd_users',{}),EV=LS.g('sd_ev',''),me=null,guest=null;
let DBX=null,SYNC={},T0=Date.now(),lastBc=0;
const did=k=>'u_'+[...k].map(c=>/[A-Za-z0-9_\-.~:@+]/.test(c)?c:'~'+c.charCodeAt(0).toString(16)+'~').join('');
function dbStat(){const e=document.getElementById('dbl');if(e)e.textContent=DBX?'☁️ Base de données en ligne (partagée)':'💾 Base de données locale (ce navigateur)'}
function dbFail(){if(!DBX)return;DBX=null;dbStat();if(typeof toast==='function')toast('Écriture en ligne refusée : mode local.')}
function dbPush(){if(!DBX)return;try{for(const k in U){const j=JSON.stringify(U[k]);if(SYNC[k]!==j){SYNC[k]=j;DBX.doc('sd_users/'+did(k)).set(JSON.parse(j)).catch(dbFail)}}
 for(const k in SYNC)if(!U[k]){delete SYNC[k];DBX.doc('sd_users/'+did(k)).delete().catch(dbFail)}}catch(e){dbFail()}}
const save=()=>{LS.s('sd_users',U);dbPush()};
const norm=()=>Object.values(U).forEach(u=>{u.inv=u.inv||[];if(u.in===undefined)u.in=null;if(u.snd===undefined)u.snd=true});
async function dbInit(){try{if(!window.claude||!window.claude.use)return;const d=await window.claude.use('db');if(!d)return;
 let first=true;
 d.collection('sd_users').onSnapshot(snap=>{const seen={};
  snap.docs.forEach(x=>{const v=x.data();if(v&&v.k){seen[v.k]=1;U[v.k]=JSON.parse(JSON.stringify(v));SYNC[v.k]=JSON.stringify(v)}});
  if(first){first=false;DBX=d}else for(const k in SYNC)if(!seen[k]){delete U[k];delete SYNC[k]}
  norm();dbPush();LS.s('sd_users',U);dbStat();
  if(me){if(!U[me.k]){LS.s('sd_note','Ton compte a été supprimé.');LS.s('sd_rm',null);location.reload();return}me=U[me.k];refresh()}},()=>{});
 d.doc('sd_meta/ev').onSnapshot(sn=>{const v=sn.exists&&sn.data();if(v&&v.ev!==undefined&&v.ev!==EV){EV=v.ev;LS.s('sd_ev',EV);pInit();theme()}},()=>{});
 d.doc('sd_meta/bc').onSnapshot(sn=>{const v=sn.exists&&sn.data();if(v&&v.t>T0&&v.t!==lastBc){lastBc=v.t;handle(v)}},()=>{})}catch(e){}}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const ADMIN_H='1d10872ad99c632c1095a511a718eef32b0ef1a878326f08a344aec7c4c9dcbe';
const R={c:['Commune',20,10],r:['Rare',35,20],e:['Épique',50,30],l:['Légendaire',100,40],k:['Cosmique',200,50],h:['Halloween',30,25]};
const W=[['w0','Pistolet','c'],['w1','Mini-SMG','c'],['w2','Revolver','r'],['w3','Carabine','r'],['w4','Fusil d’assaut','e'],['w5','Fusil à pompe','e'],['w6','Sniper','l'],['w7','Mitraillette dorée','l'],['w8','Rayon cosmique','k'],['w9','Faux maudite','h']].map(([id,n,r])=>({id,n,r,p:R[r][1],d:R[r][2]}));
const S=[['s0','Recrue','#4a90e2','#f1c9a0'],['s1','Ninja','#222','#f1c9a0'],['s2','Cyborg','#8899aa','#55e0ff'],['s3','Pilote','#e08a2e','#f1c9a0'],['s4','Explorateur','#7a8f3a','#d9a98a'],['s5','Squelette','#e8e8dc','#f4f4ea',1],['s6','Citrouille','#d9620f','#ff9a2e',1],['s7','Vampire','#5a0f1e','#e8e0e0',1],['s8','Momie','#cfc3a0','#e0d6b8',1],['s9','Sorcier','#4b2a7a','#c9d3b0',1]].map(([id,n,b,hd,hal])=>({id,n,b,hd,hal:!!hal,p:200}));
const sk=id=>S.find(s=>s.id===id)||S[0],wp=id=>W.find(w=>w.id===id);
const nu=(n,h)=>({n,k:n.toLowerCase(),h,coins:0,skins:['s0'],weps:['w0'],skin:'s0',combos:Array.from({length:5},()=>({w:['w0',null],m:'Couteau'})),combo:0,fr:[],req:[],inv:[],in:null,snd:true,admin:false,warn:0,inbox:[],cheat:{},sens:1});
norm();if(!U.maxence){U.maxence=nu('Maxence',ADMIN_H);U.maxence.admin=true;save()}
const opt=(a,f)=>a.map(f).join('');
function toast(t){const e=$('#ts');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2500)}
function banner(m,secs){const b=$('#bn');b.textContent=m;clearTimeout(banner.a);clearInterval(banner.c);
 banner.a=setTimeout(()=>{if(secs>0){let s=secs;b.textContent=s;banner.c=setInterval(()=>{s--;b.textContent=s>0?s:'';if(s<=0)clearInterval(banner.c)},1000)}else b.textContent=''},5000)}
function bc(o){const t=Date.now();lastBc=t;LS.s('sd_bc',{...o,t:Math.random()});handle(o);if(DBX){DBX.doc('sd_meta/bc').set({...o,t}).catch(dbFail);if(o.ev!==undefined)DBX.doc('sd_meta/ev').set({ev:o.ev}).catch(dbFail)}}
function handle(o){if(o.ev!==undefined){EV=o.ev;LS.s('sd_ev',EV);pInit();theme()}
 if(o.msg&&(!o.to||me&&o.to===me.k))banner(o.msg,o.secs||0)}
addEventListener('storage',e=>{if(!e.newValue)return;if(e.key==='sd_bc')handle(JSON.parse(e.newValue));
 if(e.key==='sd_users'){U=JSON.parse(e.newValue);norm();if(me&&!U[me.k]){LS.s('sd_note','Ton compte a été supprimé.');LS.s('sd_rm',null);location.reload();return}if(me){me=U[me.k];refresh()}}
 if(e.key==='sd_ev'){EV=JSON.parse(e.newValue);pInit();theme()}});
addEventListener('pagehide',save);addEventListener('beforeunload',save);

/* Connexion */
const err=t=>$('#ae').textContent=t;
async function auth(reg){const n=$('#u').value.trim(),p=$('#p').value;if(n.length<2||p.length<4)return err('Nom (2 caractères min.) et mot de passe (4 min.) requis.');
 const k=n.toLowerCase(),h=await hash(k+':'+p);
 if(reg){if(U[k])return err('Ce nom est déjà pris.');U[k]=nu(n,h);save()}else if(!U[k]||U[k].h!==h)return err('Identifiants incorrects.');
 LS.s('sd_rm',$('#rm').checked?k:null);enter(k)}
function enter(k){me=U[k];initGL();$('#auth').hidden=true;$('#lobby').hidden=false;refresh();theme();me.inbox.splice(0).forEach(m=>toast(m));save()}
$('#sp').onclick=()=>{const p=$('#p');p.type=p.type==='password'?'text':'password';$('#sp').textContent=p.type==='password'?'Afficher':'Masquer'};
$('#li').onclick=()=>auth(false);$('#su').onclick=()=>auth(true);
$('#p').onkeydown=e=>{if(e.key==='Enter')auth(false)};
const fg=(s,l)=>`<div class="fg"><i style="background:${s.hd}"></i><b style="background:${s.b}"></b><em></em><u>${l}</u></div>`;
const pmem=u=>{const h=u.in&&U[u.in]?u.in:u.k;return[h,...Object.values(U).filter(x=>x.in===h&&x.k!==h).map(x=>x.k)].filter(k=>U[k]).slice(0,2)};
const mate=()=>pmem(me).find(k=>k!==me.k)||null;
const lsig=()=>{const mk=mate();return me.skin+'|'+(mk?U[mk].skin:'')+'|'+me.combos[me.combo].w[0]+'|'+EV};
function uiParty(){const mk=mate(),host=me.in&&U[me.in]?me.in:null;$('#grp').hidden=!mk;
 if(mk)$('#grp').innerHTML=`<span>👥 <b>${me.n}</b> + <b>${U[mk].n}</b> · ${host?'chef : '+U[host].n:'tu es le chef'}</span><button class="abtn bad" data-a="lg">Quitter le groupe</button>`;
 const iv=me.inv.filter(k=>U[k]);$('#ivc').hidden=!iv.length;
 $('#ivc').innerHTML=opt(iv,k=>`<div class="ivrow"><span>📨 <b>${U[k].n}</b> t’invite dans son groupe</span><button class="abtn ok" data-a="ia" data-k="${k}">Accepter</button><button data-a="ir" data-k="${k}">Refuser</button></div>`);
 const nb=me.req.filter(k=>U[k]).length+iv.length;$('#mb').dataset.n=nb||''}
function refresh(){$('#coins').textContent='🪙 '+me.coins;$('#adbtn').hidden=!me.admin;const mk=mate();$('#av').hidden=!!mk;
 $('#av').innerHTML=`<u class="np">${me.n}</u>`;uiParty();if(LB&&LB.sig!==lsig())buildLobby()}
function theme(){const c={halloween:['#ff8a2b','#3a0f5a','#120622'],printemps:['#f2c230','#7a4a12','#2a1a08'],noel:['#7fd0ff','#1b4aa0','#0a1a3a'],fetes:['#ff5ad1','#5a2bb5','#1a0a4a']}[EV]||['#5bc0ff','#5a2bb5','#2a1670'];
 document.documentElement.style.setProperty('--lb',`radial-gradient(ellipse at 50% 55%,${c[0]}66,transparent 55%),repeating-linear-gradient(115deg,#ffffff0a 0 40px,transparent 40px 110px),linear-gradient(180deg,#1e3fae 0%,${c[1]} 58%,${c[2]} 100%)`)}

/* Panneaux */
const RC={c:'#b0b8c4',r:'#4db8ff',e:'#b06bff',l:'#ffb020',k:'#ff4dd2',h:'#ff7a1a'};
const SMG='<rect x="14" y="15" width="74" height="13" rx="3"/><rect x="42" y="28" width="11" height="20" rx="2"/><rect x="24" y="28" width="11" height="16" rx="2"/><rect x="88" y="19" width="22" height="5"/>';
const SH={w0:'<rect x="22" y="12" width="64" height="13" rx="3"/><rect x="30" y="25" width="15" height="21" rx="3"/><rect x="82" y="15" width="12" height="5"/>',w1:SMG,
 w2:'<circle cx="46" cy="20" r="13"/><rect x="52" y="14" width="56" height="9" rx="2"/><path d="M26 28h14l-6 20H22z"/>',
 w3:'<rect x="6" y="17" width="16" height="16" rx="3"/><rect x="20" y="19" width="92" height="9" rx="2"/><rect x="52" y="28" width="9" height="14" rx="2"/><rect x="62" y="11" width="22" height="6" rx="2"/>',
 w4:'<rect x="4" y="16" width="16" height="18" rx="3"/><rect x="18" y="18" width="80" height="11" rx="2"/><path d="M52 29h12l-3 18H48z"/><rect x="98" y="21" width="20" height="4"/><rect x="66" y="12" width="20" height="6" rx="2"/>',
 w5:'<rect x="4" y="19" width="28" height="13" rx="4"/><rect x="30" y="16" width="86" height="6" rx="2"/><rect x="30" y="24" width="74" height="5" rx="2"/><rect x="62" y="31" width="20" height="7" rx="3"/>',
 w6:'<rect x="4" y="19" width="20" height="13" rx="4"/><rect x="22" y="22" width="96" height="6" rx="2"/><rect x="44" y="10" width="36" height="9" rx="4"/><path d="M70 28l-8 18M80 28l8 18" stroke="~" stroke-width="2"/>',
 w7:SMG+'<rect x="14" y="19" width="74" height="3" fill="#fff"/>',
 w8:'<rect x="14" y="14" width="70" height="22" rx="11"/><rect x="82" y="19" width="28" height="12" rx="4"/><circle cx="112" cy="25" r="6" fill="#fff"/><circle cx="36" cy="25" r="5" fill="#fff9"/>',
 w9:'<path d="M20 46L92 8" stroke="#8a6a45" stroke-width="4" fill="none"/><path d="M92 8C112 8 118 24 108 36 110 22 102 14 88 14Z"/>',
 'Couteau':'<path d="M22 30L88 14 102 22 32 38Z" fill="#cfd6e0"/><rect x="6" y="31" width="26" height="9" rx="3" fill="#6b4a2b"/>',
 'Batte de baseball':'<rect x="14" y="28" width="94" height="10" rx="5" transform="rotate(-16 60 33)" fill="#c8a26b"/>'};
let gid=0;
const DET={w0:'<rect x="58" y="14" width="2.5" height="9"/><rect x="63" y="14" width="2.5" height="9"/><rect x="33" y="30" width="8" height="2"/>',
 w1:'<rect x="44" y="33" width="7" height="2"/><rect x="44" y="39" width="7" height="2"/><rect x="60" y="18" width="14" height="3"/>',
 w2:'<circle cx="46" cy="20" r="4"/><rect x="60" y="17" width="40" height="2"/>',
 w3:'<rect x="30" y="21" width="30" height="2"/><rect x="62" y="12.5" width="20" height="3"/>',
 w4:'<rect x="30" y="21" width="40" height="2"/><rect x="54" y="35" width="8" height="2"/><rect x="68" y="13.5" width="16" height="3"/>',
 w5:'<rect x="66" y="32.5" width="2" height="4"/><rect x="72" y="32.5" width="2" height="4"/><rect x="40" y="18" width="60" height="1.5"/>',
 w6:'<rect x="48" y="12" width="28" height="3"/><rect x="30" y="24" width="60" height="1.5"/>',
 w7:'<rect x="44" y="33" width="7" height="2"/><rect x="44" y="39" width="7" height="2"/><rect x="60" y="18" width="14" height="3"/>',
 w8:'<rect x="30" y="22" width="40" height="3" opacity=".6"/><circle cx="76" cy="25" r="3"/>',
 'Couteau':'<rect x="12" y="34" width="3" height="5"/><rect x="20" y="33" width="3" height="6"/>'};
const svg=(k,c)=>{const i='gr'+gid++;return`<svg viewBox="0 0 120 50" width="96" height="40"><defs><linearGradient id="${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".35" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".7"/></linearGradient></defs><g fill="url(#${i})" stroke="#ffffff88" stroke-width="1" stroke-linejoin="round">${SH[k].replace(/~/g,c)}</g><g fill="#0b1030" stroke="none" opacity=".8">${DET[k]||''}</g></svg>`};
const wImg=(w,n)=>`<div class="wi" style="border-color:${RC[w.r]}">${svg(w.id,RC[w.r])}${n?`<small>${w.n}</small>`:''}</div>`;
const meleeImg=m=>`<div class="wi" style="border-color:#cfd6e0">${svg(m,'#cfd6e0')}<small>${m}</small></div>`;
const skImg=s=>`<div class="sk" data-s="${s.id}"><i style="background:${s.hd}"></i><b style="background:${s.b}"></b><em></em></div>`;
const A={};
function tabs(t){document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function openP(t,h){tabs(t);const pn=$('#pan'),bx=pn.querySelector('.box'),keep=pn.dataset.t===t&&!pn.hidden,st=bx.scrollTop,l={Boutique:'full',Armurerie:'side',Avatar:'side','Panneau admin':'adm'}[t]||'modal';
 pn.dataset.l=l;pn.dataset.t=t;$('#pt').textContent=t;$('#pb').innerHTML=h;$('#pb').classList.toggle('fresh',!keep);pn.hidden=false;bx.scrollTop=keep?st:0;
 $('#sel').style.visibility=$('#adbtn').style.visibility=$('#av').style.visibility=l==='modal'?'':'hidden'}
A.close=()=>{$('#pan').hidden=true;$('#pan').dataset.t='';tabs('Lobby');$('#sel').style.visibility=$('#adbtn').style.visibility=$('#av').style.visibility='';if(GM&&!GM.over&&!GM.nolock&&!locked)$('#pause').hidden=false};
const gcs=(c,i)=>`style="--rc:${c};background:linear-gradient(165deg,${c}66,#0b1030 78%);animation-delay:${i*45}ms"`;
const skC=s=>s.hal?'#ff7a1a':'#4db8ff',skb=s=>`<div class="skb">${skImg(s)}</div>`;
const svgW=(k,c,w)=>svg(k,c).replace('width="96" height="40"',`width="${w}" height="${Math.round(w*.417)}"`);
let armSlot='0';
A.pAv=()=>openP('Avatar',`<small>Clique sur un avatar pour l’équiper : ton personnage change à gauche.</small><div class="grid">${opt(me.skins,(id,i)=>{const s=sk(id),c=skC(s);return`<div class="gc ${me.skin===id?'on':''}" ${gcs(c,i)} data-a="eq" data-id="${id}"><span class="tag" style="background:${c}">${s.hal?'Halloween':'Avatar'}</span>${skb(s)}<b>${s.n}</b><span class="own">${me.skin===id?'ÉQUIPÉ':'Équiper'}</span></div>`})}</div>`);
A.eq=t=>{me.skin=t.dataset.id;save();refresh();A.pAv()};
function daily(){const d=new Date(Date.now()-7*36e5),seed=d.getFullYear()*1e4+d.getMonth()*100+d.getDate()+(EV==='halloween'?7:0);
 let a=seed;const r=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const sh=x=>x.map(v=>[r(),v]).sort((p,q)=>p[0]-q[0]).map(v=>v[1]);
 return{w:sh(W.filter(w=>w.id!=='w0'&&(w.r!=='h'||EV==='halloween'))).slice(0,3),s:sh(S.filter(s=>s.id!=='s0'&&(!s.hal||EV==='halloween'))).slice(0,2)}}
A.pShop=()=>{const D=daily(),n=new Date(),nx=new Date(n);nx.setHours(7,0,0,0);if(nx<=n)nx.setDate(nx.getDate()+1);const m=Math.round((nx-n)/6e4);
 const buy=(t,i,has)=>has?'<span class="own">POSSÉDÉ</span>':`<button class="buy ${me.coins<i.p?'no':''}" data-a="buy" data-t="${t}" data-id="${i.id}">🪙 ${i.p}</button>`;
 openP('Boutique',`<div class="shead"><div><h3 class="sub" style="margin:0">Boutique du jour</h3><small>Nouveautés à 7h00 · changement dans ${Math.floor(m/60)} h ${m%60} min</small></div><div class="cn">🪙 ${me.coins}</div></div>
 <h3 class="sub">Armes</h3><div class="grid">${opt(D.w,(w,i)=>{const c=RC[w.r];return`<div class="gc" ${gcs(c,i)}><span class="tag" style="background:${c}">${R[w.r][0]}</span>${svgW(w.id,c,130)}<b>${w.n}</b><small>−${w.d} PV par tir</small>${buy('w',w,me.weps.includes(w.id))}</div>`})}</div>
 <h3 class="sub">Avatars</h3><div class="grid">${opt(D.s,(s,i)=>{const c=skC(s);return`<div class="gc" ${gcs(c,i+3)}><span class="tag" style="background:${c}">${s.hal?'Halloween':'Avatar'}</span>${skb(s)}<b>${s.n}</b><small>${s.hal?'Édition Halloween':'Skin'}</small>${buy('s',s,me.skins.includes(s.id))}</div>`})}</div>`)};
A.buy=t=>{const w=t.dataset.t==='w',i=w?wp(t.dataset.id):sk(t.dataset.id);if(me.coins<i.p)return toast('Pas assez de pièces.');

 const to=h?h.point:rayc.ray.at(60,V(0,0,0));tracer(cam.localToWorld(V(.28,-.22,-1.1)),to,0xffe9a0);GM.flash=.05;sfx(SN[s.r]||2000);

function step(dt){const pe=GM.P,E=GM.ents;GM.t=(GM.t||0)+dt;if(GM.nolock&&!GM.touch){const dz=v=>Math.abs(v)>.18?v:0;P.yaw-=dz(mxo)*2.4*dt*me.sens;P.pitch=Math.max(-1.2,Math.min(1.2,-myo*.7))}if(pe.alive){const sp=keys.ShiftLeft?10:7,fx_=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);let mx=0,mz=0;
  if(keys.KeyW||keys.ArrowUp){mx+=fx_;mz+=fz}if(keys.KeyS||keys.ArrowDown){mx-=fx_;mz-=fz}if(keys.KeyD||keys.ArrowRight){mx+=rx;mz+=rz}if(keys.KeyA||keys.ArrowLeft){mx-=rx;mz-=rz}
  mx+=fx_*(-jy)+rx*jx;mz+=fz*(-jy)+rz*jx;const n=Math.max(1,Math.hypot(mx,mz));GM.mv=Math.hypot(mx,mz)>.1&&P.y<=0;P.x+=mx/n*sp*dt;P.z+=mz/n*sp*dt;
  if(me.cheat.fly){P.vy=0;if(keys.Space)P.y+=8*dt;if(keys.KeyC)P.y=Math.max(0,P.y-8*dt)}else{if(keys.Space&&P.y<=0)P.vy=7;P.vy-=20*dt;P.y=Math.max(0,P.y+P.vy*dt);if(!P.y)P.vy=0}
  push(P,.4);pe.x=P.x;pe.z=P.z;P.cd-=dt;if(firing)fire()}
 for(const b of E){if(b.isP||!b.alive)continue;const en=E.filter(a=>a.alive&&a.team!==b.team);if(!en.length)break;let t=en[0],bd=1e9;
  for(const a of en){const d=Math.hypot(a.x-b.x,a.z-b.z);if(d<bd){bd=d;t=a}}
  const dx=t.x-b.x,dz=t.z-b.z;b.st=b.st||1;if(Math.random()<.01)b.st*=-1;
  const vx=bd>13?dx/bd:-dz/bd*b.st,vz=bd>13?dz/bd:dx/bd*b.st;b.x+=vx*3.8*dt;b.z+=vz*3.8*dt;push(b,.45);
  b.cd-=dt;if(b.cd<=0&&bd<45){b.cd=rnd(.8,1.4);rayc.set(V(b.x,1.6,b.z),V(dx,0,dz).normalize());rayc.far=bd;if(!rayc.intersectObjects(GM.solid).length){tracer(V(b.x,1.4,b.z),V(t.x,1.2,t.z),b.team?0xff6b81:0x7fd0ff);if(bd<35)sfx(1800,.1,.08);if(Math.random()<.6-bd/110){dmgEnt(t,b.d);if(t.isP)sfx(500,.12,.25)}}}
  b.g.position.set(b.x,0,b.z);b.g.rotation.y=Math.atan2(dx,dz);if(b.limbs){const sw=Math.sin(GM.t*9+b.ph)*.7,L=b.limbs;L.ll.rotation.x=sw;L.lr.rotation.x=-sw;L.al.rotation.x=-sw*.6;L.ar.rotation.x=sw*.6}}
 $('#shb').style.width=pe.sh+'%';$('#hpb').style.width=pe.hp+'%';$('#shn').textContent=pe.sh|0;$('#hpn').textContent=pe.hp|0;$('#sc').textContent='Manches '+GM.score[0]+' – '+GM.score[1]+' (3 pour gagner)';
 $('#wp').innerHTML=GM.slots.map((s,i)=>`<div style="${i===GM.cur?'color:var(--ac)':''}">${i+1} · ${s.n}</div>`).join('')+(pe.alive?'':'<div style="color:var(--bad)">Éliminé</div>')}

 if(GM&&!GM.over){if(act())step(dt);if(GM.fall)GM.fall.u(dt);GM.rec=(GM.rec||0)*Math.max(0,1-dt*12);gunG.position.z=-.55+GM.rec;gunG.rotation.x=GM.rec*1.4;gunG.visible=GM.P.alive;gunG.position.y=-.26+(GM.mv?Math.sin((GM.t||0)*9)*.012:0);if(GM.fl){GM.flash=(GM.flash||0)-dt;GM.fl.visible=GM.flash>0}if(GM.spin)GM.spin.rotation.y+=dt;if(GM.clouds)GM.clouds.forEach(c=>{c.userData.a+=dt*.02;c.position.x=Math.cos(c.userData.a)*c.userData.r;c.position.z=Math.sin(c.userData.a)*c.userData.r});cam.position.set(P.x,P.y+(GM.P.alive?1.7:.4),P.z);cam.rotation.set(P.pitch,P.yaw,0);ren.render(sc,cam)}
